services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: medicalapp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-medicalapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-medicalapp}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  medicalapp:
    build: .
    container_name: medicalapp
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@dbbooks_high?TNS_ADMIN=/app/wallet
      SPRING_DATASOURCE_USERNAME: ${ORACLE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.OracleDialect
      IDP_ISSUER_URI: ${IDP_ISSUER_URI}
      IDP_JWK_SET_URI: ${IDP_JWK_SET_URI}
      MEDICALAPP_API_MANAGER_REQUIRED: ${MEDICALAPP_API_MANAGER_REQUIRED:-false}
      MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY: ${MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY}
      MEDICALAPP_FRONTEND_API_BASE_URL: ${MEDICALAPP_FRONTEND_API_BASE_URL:-}
      MEDICALAPP_AUTH_SCOPES: ${MEDICALAPP_AUTH_SCOPES:-openid profile}
      ORACLE_WALLET_BASE64: ${ORACLE_WALLET_BASE64}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-medicalapp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-medicalapp}
      MEDICALAPP_RABBITMQ_QUEUE: ${MEDICALAPP_RABBITMQ_QUEUE:-medicalapp.eventos-clinicos}
      MEDICALAPP_RABBITMQ_EXCHANGE: ${MEDICALAPP_RABBITMQ_EXCHANGE:-medicalapp.exchange}
      MEDICALAPP_RABBITMQ_ROUTING_KEY: ${MEDICALAPP_RABBITMQ_ROUTING_KEY:-eventos.clinicos}
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
