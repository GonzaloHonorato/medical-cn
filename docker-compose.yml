services:
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: medicalapp-kafka-1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: medicalapp-kafka-2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: medicalapp-kafka-3
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  medicalapp:
    build: .
    container_name: medicalapp
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@dbbooks_high?TNS_ADMIN=/app/wallet
      SPRING_DATASOURCE_USERNAME: ${ORACLE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${ORACLE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: oracle.jdbc.OracleDriver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.OracleDialect
      IDP_ISSUER_URI: ${IDP_ISSUER_URI}
      IDP_JWK_SET_URI: ${IDP_JWK_SET_URI}
      MEDICALAPP_API_MANAGER_REQUIRED: ${MEDICALAPP_API_MANAGER_REQUIRED:-false}
      MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY: ${MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY}
      MEDICALAPP_FRONTEND_API_BASE_URL: ${MEDICALAPP_FRONTEND_API_BASE_URL:-}
      MEDICALAPP_AUTH_SCOPES: ${MEDICALAPP_AUTH_SCOPES:-openid profile}
      ORACLE_WALLET_BASE64: ${ORACLE_WALLET_BASE64}
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      KAFKA_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      MEDICALAPP_KAFKA_TOPIC_SENALES: ${MEDICALAPP_KAFKA_TOPIC_SENALES:-senales_vitales}
      MEDICALAPP_KAFKA_TOPIC_ALERTAS: ${MEDICALAPP_KAFKA_TOPIC_ALERTAS:-alertas}
      MEDICALAPP_KAFKA_TOPIC_RESUMENES: ${MEDICALAPP_KAFKA_TOPIC_RESUMENES:-resumenes-signos}
      MEDICALAPP_SIMULATOR_ENABLED: ${MEDICALAPP_SIMULATOR_ENABLED:-true}
      MEDICALAPP_SIMULATOR_INTERVAL_MS: ${MEDICALAPP_SIMULATOR_INTERVAL_MS:-900000}
      MEDICALAPP_ALERT_FILES_PATH: ${MEDICALAPP_ALERT_FILES_PATH:-/app/hospital-alert-files}
      MEDICALAPP_SUMMARY_SCHEDULER_ENABLED: ${MEDICALAPP_SUMMARY_SCHEDULER_ENABLED:-true}
      MEDICALAPP_SUMMARY_INTERVAL_MS: ${MEDICALAPP_SUMMARY_INTERVAL_MS:-300000}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_ORACLE_JDBC: ${LOGGING_LEVEL_ORACLE_JDBC:-WARN}
      LOGGING_LEVEL_ORACLE_NET: ${LOGGING_LEVEL_ORACLE_NET:-WARN}
      LOGGING_LEVEL_HIKARI: ${LOGGING_LEVEL_HIKARI:-WARN}
      LOGGING_LEVEL_HIBERNATE_SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:-WARN}
      LOGGING_LEVEL_HIBERNATE_BIND: ${LOGGING_LEVEL_HIBERNATE_BIND:-WARN}
      LOGGING_LEVEL_MEDICALAPP: ${LOGGING_LEVEL_MEDICALAPP:-INFO}
    expose:
      - 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - medicalapp-alert-files:/app/hospital-alert-files

volumes:
  medicalapp-alert-files:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
