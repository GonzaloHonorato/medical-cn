spring.datasource.url=jdbc:h2:mem:medicalapp;MODE=Oracle;DATABASE_TO_UPPER=true;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

medicalapp.api-manager.required=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Un solo broker local: replicacion y particiones en 1.
medicalapp.kafka.partitions=${KAFKA_PARTITIONS:1}
medicalapp.kafka.replication-factor=${KAFKA_REPLICATION_FACTOR:1}
medicalapp.alert-files.path=${MEDICALAPP_ALERT_FILES_PATH:${java.io.tmpdir}/medicalapp-alert-files}
medicalapp.summary.scheduler-enabled=${MEDICALAPP_SUMMARY_SCHEDULER_ENABLED:false}
