spring.application.name=medicalapp
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@dbbooks_high?TNS_ADMIN=/app/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ADMIN}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDP_JWK_SET_URI:https://ghdevcompany.b2clogin.com/ghdevcompany.onmicrosoft.com/b2c_1_dn-gh/discovery/v2.0/keys}
medicalapp.security.issuer=${IDP_ISSUER_URI:https://ghdevcompany.b2clogin.com/ac1dbc9b-27a4-4004-a719-42d96af26d37/v2.0/}

medicalapp.api-manager.required=${MEDICALAPP_API_MANAGER_REQUIRED:false}
medicalapp.api-manager.subscription-key=${MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY:dev-medicalapp-key}
medicalapp.frontend.api-base-url=${MEDICALAPP_FRONTEND_API_BASE_URL:}
medicalapp.frontend.auth-scopes=${MEDICALAPP_AUTH_SCOPES:openid profile}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:medicalapp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:medicalapp}
medicalapp.rabbitmq.queue=${MEDICALAPP_RABBITMQ_QUEUE:medicalapp.eventos-clinicos}
medicalapp.rabbitmq.exchange=${MEDICALAPP_RABBITMQ_EXCHANGE:medicalapp.exchange}
medicalapp.rabbitmq.routing-key=${MEDICALAPP_RABBITMQ_ROUTING_KEY:eventos.clinicos}
medicalapp.rabbitmq.alert-oracle-queue=${MEDICALAPP_RABBITMQ_ALERT_ORACLE_QUEUE:medicalapp.alertas.oracle}
medicalapp.rabbitmq.alert-file-queue=${MEDICALAPP_RABBITMQ_ALERT_FILE_QUEUE:medicalapp.alertas.archivos}
medicalapp.rabbitmq.alert-routing-key=${MEDICALAPP_RABBITMQ_ALERT_ROUTING_KEY:alertas.clinicas}
medicalapp.rabbitmq.summary-queue=${MEDICALAPP_RABBITMQ_SUMMARY_QUEUE:medicalapp.resumenes-signos}
medicalapp.rabbitmq.summary-routing-key=${MEDICALAPP_RABBITMQ_SUMMARY_ROUTING_KEY:resumenes.signos-vitales}
medicalapp.alert-files.path=${MEDICALAPP_ALERT_FILES_PATH:/app/hospital-alert-files}
medicalapp.summary.scheduler-enabled=${MEDICALAPP_SUMMARY_SCHEDULER_ENABLED:true}
medicalapp.summary.interval-ms=${MEDICALAPP_SUMMARY_INTERVAL_MS:300000}

logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.oracle.jdbc=${LOGGING_LEVEL_ORACLE_JDBC:WARN}
logging.level.oracle.net=${LOGGING_LEVEL_ORACLE_NET:WARN}
logging.level.com.zaxxer.hikari=${LOGGING_LEVEL_HIKARI:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_HIBERNATE_SQL:WARN}
logging.level.org.hibernate.orm.jdbc.bind=${LOGGING_LEVEL_HIBERNATE_BIND:WARN}
logging.level.com.medicalapp.medicalapp=${LOGGING_LEVEL_MEDICALAPP:INFO}
