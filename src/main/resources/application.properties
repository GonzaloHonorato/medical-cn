spring.application.name=medicalapp
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@dbbooks_high?TNS_ADMIN=/app/wallet}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ADMIN}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${IDP_JWK_SET_URI:https://ghdevcompany.b2clogin.com/ghdevcompany.onmicrosoft.com/b2c_1_dn-gh/discovery/v2.0/keys}
medicalapp.security.issuer=${IDP_ISSUER_URI:https://ghdevcompany.b2clogin.com/ac1dbc9b-27a4-4004-a719-42d96af26d37/v2.0/}

medicalapp.api-manager.required=${MEDICALAPP_API_MANAGER_REQUIRED:false}
medicalapp.api-manager.subscription-key=${MEDICALAPP_API_MANAGER_SUBSCRIPTION_KEY:dev-medicalapp-key}
medicalapp.frontend.api-base-url=${MEDICALAPP_FRONTEND_API_BASE_URL:}
medicalapp.frontend.auth-scopes=${MEDICALAPP_AUTH_SCOPES:openid profile}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:medicalapp}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:medicalapp}
medicalapp.rabbitmq.queue=${MEDICALAPP_RABBITMQ_QUEUE:medicalapp.eventos-clinicos}
medicalapp.rabbitmq.exchange=${MEDICALAPP_RABBITMQ_EXCHANGE:medicalapp.exchange}
medicalapp.rabbitmq.routing-key=${MEDICALAPP_RABBITMQ_ROUTING_KEY:eventos.clinicos}
